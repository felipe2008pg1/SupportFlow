server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hide Nginx version from response headers and error pages
    # (reduces information disclosure about server software/version).
    server_tokens off;

    # Prevent directory listing if index.html is ever removed.
    autoindex off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Content-Security-Policy: only same-origin assets/scripts/styles, no
    # inline scripts, no object embeds. connect-src explicitly allows the
    # local backend origin so fetch() calls from js/main.js succeed.
    # NOTE: http://localhost:8000 is hardcoded for local development; this
    # becomes environment-configurable when we introduce per-environment
    # builds (tracked as a follow-up, not yet implemented).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' http://localhost:8000; img-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Deny access to hidden files (e.g. accidental .env, .git).
    location ~ /\. {
        deny all;
    }
}
